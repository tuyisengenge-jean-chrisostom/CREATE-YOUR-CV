<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iMENA CV Builder — Africa's Most Intelligent Career Platform</title>
    <meta name="description" content="Build a world-class CV with Africa's first deep-reasoning AI career co-pilot.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- ====== All your existing CSS (unchanged) ====== -->
    <style>/* ... copy all your CSS from above ... */</style>
</head>
<body>
    <!-- ====== Same HTML structure (unchanged) ====== -->
    <!-- ... all your views, modals, navigation, etc. ... -->

    <!-- Firebase SDK (importmap) -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. IMPORTS (Firebase only)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'firebase/auth';
        import { getFirestore, doc, setDoc, getDoc, collection, query, getDocs } from 'firebase/firestore';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. FIREBASE CONFIG (your own)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const firebaseConfig = {
            apiKey: "AIzaSyBf5M38U2u_jX126FxFcJgGZGZFnYX78R0",
            authDomain: "imena-cv-builder.firebaseapp.com",
            projectId: "imena-cv-builder",
            storageBucket: "imena-cv-builder.firebasestorage.app",
            messagingSenderId: "1098356304084",
            appId: "1:1098356304084:web:29695079a909e7182af341",
            measurementId: "G-1RLQF6YWJZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. STATE (unchanged)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let currentUser = null;
        let currentView = 'landing';
        let cvData = {
            name: '', title: '', location: '', email: '', phone: '', site: '',
            summary: '', skills: '', languages: '',
            experience: [{ role: '', company: '', start: '', end: '', description: '' }],
            education: [{ degree: '', school: '', year: '' }],
            template: 'modern'
        };
        let savedCVs = [];
        let saveTimeout = null;
        const saveIndicator = document.getElementById('saveIndicator');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4. UI HELPERS (same as before)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const ui = {
            toast(msg, type = 'success') {
                const container = document.getElementById('toastContainer');
                const el = document.createElement('div');
                el.className = `toast ${type}`;
                el.innerHTML = (type === 'success' ? '✓' : '⚠') + ' ' + msg;
                container.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            },
            openModal(title, html) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = html;
                document.getElementById('modalOverlay').classList.add('open');
            },
            closeModal() {
                document.getElementById('modalOverlay').classList.remove('open');
            }
        };
        document.getElementById('modalCloseBtn').addEventListener('click', ui.closeModal);
        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target === document.getElementById('modalOverlay')) ui.closeModal();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5. AUTHENTICATION (same as before)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function signInWithGoogle() {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                currentUser = {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    photo: user.photoURL
                };
                localStorage.setItem('imena_user', JSON.stringify(currentUser));
                await setDoc(doc(db, 'users', user.uid), {
                    name: user.displayName,
                    email: user.email,
                    photo: user.photoURL,
                    updatedAt: new Date()
                }, { merge: true });
                updateAuthUI();
                router.navigate('dashboard');
                ui.toast(`Welcome, ${user.displayName}!`, 'success');
            } catch (error) {
                console.error('Sign-in error:', error);
                ui.toast('Sign-in failed: ' + error.message, 'error');
            }
        }

        async function signOutUser() {
            try {
                await signOut(auth);
                currentUser = null;
                localStorage.removeItem('imena_user');
                updateAuthUI();
                router.navigate('landing');
                ui.toast('Signed out successfully');
            } catch (error) {
                ui.toast('Sign-out failed', 'error');
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    photo: user.photoURL
                };
                localStorage.setItem('imena_user', JSON.stringify(currentUser));
                setDoc(doc(db, 'users', user.uid), {
                    name: user.displayName,
                    email: user.email,
                    photo: user.photoURL,
                    updatedAt: new Date()
                }, { merge: true }).catch(console.error);
                updateAuthUI();
                if (currentView === 'landing') {
                    router.navigate('dashboard');
                }
            } else {
                currentUser = null;
                localStorage.removeItem('imena_user');
                updateAuthUI();
                if (currentView !== 'landing') {
                    router.navigate('landing');
                }
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6. FIRESTORE OPERATIONS (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function saveCVToFirestore() {
            if (!currentUser) {
                ui.toast('Please sign in to save your CV.', 'error');
                return;
            }
            try {
                saveIndicator.textContent = 'Saving...';
                saveIndicator.classList.add('visible');
                const cvRef = doc(db, 'users', currentUser.uid, 'cvs', 'main');
                await setDoc(cvRef, {
                    ...cvData,
                    updatedAt: new Date()
                }, { merge: true });
                saveIndicator.textContent = '✓ Saved';
                setTimeout(() => saveIndicator.classList.remove('visible'), 2000);
                ui.toast('CV saved to cloud!', 'success');
            } catch (error) {
                console.error('Save error:', error);
                saveIndicator.textContent = '⚠ Error';
                setTimeout(() => saveIndicator.classList.remove('visible'), 2000);
                ui.toast('Failed to save CV: ' + error.message, 'error');
            }
        }

        async function loadCVFromFirestore() {
            if (!currentUser) return null;
            try {
                const cvRef = doc(db, 'users', currentUser.uid, 'cvs', 'main');
                const docSnap = await getDoc(cvRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    cvData = { ...cvData, ...data };
                    return cvData;
                }
                return null;
            } catch (error) {
                console.error('Load error:', error);
                return null;
            }
        }

        async function loadCVsList() {
            if (!currentUser) return;
            try {
                const q = query(collection(db, 'users', currentUser.uid, 'cvs'));
                const querySnapshot = await getDocs(q);
                const list = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    list.push({
                        id: doc.id,
                        name: data.name || 'Untitled CV',
                        template: data.template || 'modern',
                        updated: data.updatedAt ? new Date(data.updatedAt.seconds * 1000).toLocaleDateString() : 'Unknown',
                        score: data.score || '—'
                    });
                });
                savedCVs = list;
                updateDashboard();
            } catch (error) {
                console.error('Load list error:', error);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 7. ROUTER (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const router = {
            async navigate(view) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const target = document.getElementById('view-' + view);
                if (target) target.classList.add('active');
                const navLink = document.querySelector(`.nav-link[data-view="${view}"]`);
                if (navLink) navLink.classList.add('active');
                currentView = view;
                window.scrollTo(0, 0);

                if (view === 'dashboard') {
                    await loadCVsList();
                    updateDashboard();
                }
                if (view === 'builder') {
                    if (currentUser) {
                        const data = await loadCVFromFirestore();
                        if (data) {
                            populateFormFromData(data);
                            renderBuilder();
                            updateCV();
                        } else {
                            if (!cvData.name) loadDemo();
                            renderBuilder();
                        }
                    } else {
                        if (!cvData.name) loadDemo();
                        renderBuilder();
                    }
                }
                if (view === 'ai-studio') {
                    // ensure studio shows welcome
                }
            }
        };
        window.router = router;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 8. UI UPDATE (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateAuthUI() {
            const isAuth = !!currentUser;
            const loginBtn = document.getElementById('navLogin');
            const logoutBtn = document.getElementById('navLogout');
            const userDiv = document.getElementById('navUser');
            const avatar = document.getElementById('navAvatar');
            const navLinks = ['navDashboard', 'navBuilder', 'navAIStudio'];

            loginBtn.classList.toggle('hidden', isAuth);
            logoutBtn.classList.toggle('hidden', !isAuth);
            userDiv.classList.toggle('visible', isAuth);

            navLinks.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('hidden', !isAuth);
            });

            if (isAuth && avatar) {
                avatar.src = currentUser.photo || 'https://ui-avatars.com/api/?name=User&background=39e0bd&color=fff';
                avatar.alt = currentUser.name || 'User';
            }
            const dashName = document.getElementById('dashName');
            if (dashName && currentUser) {
                dashName.textContent = currentUser.name.split(' ')[0] || 'Builder';
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 9. DASHBOARD (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateDashboard() {
            const hour = new Date().getHours();
            let greeting = 'Good evening';
            if (hour < 12) greeting = 'Good morning';
            else if (hour < 17) greeting = 'Good afternoon';
            document.getElementById('dashTime').textContent = greeting;

            document.getElementById('dashStatCVs').textContent = savedCVs.length;
            document.getElementById('dashStatAI').textContent = Math.floor(Math.random() * 20) + 5;
            document.getElementById('dashStatScore').textContent = savedCVs.length > 0 ? '92' : '—';

            const list = document.getElementById('dashCVList');
            if (savedCVs.length === 0) {
                list.innerHTML = `
              <div class="create-new-card" id="dashCreateNew">
                <div class="plus">+</div><span>Create new CV</span>
              </div>
            `;
            } else {
                list.innerHTML = savedCVs.map((cv, i) => `
              <div class="cv-item-card" data-cv="${i}">
                <div class="cv-thumb">📄</div>
                <h4>${cv.name || 'Untitled'}</h4>
                <div class="meta"><span>${cv.template}</span><span>${cv.updated}</span></div>
                <div class="actions">
                  <button class="cv-edit" data-cv="${i}">✎</button>
                  <button class="cv-print" data-cv="${i}">⬇</button>
                </div>
              </div>
            `).join('');
            }

            document.querySelectorAll('.cv-edit').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    router.navigate('builder');
                });
            });
            document.querySelectorAll('.cv-print').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    window.print();
                });
            });
            document.querySelectorAll('.cv-item-card').forEach(card => {
                card.addEventListener('click', function() {
                    router.navigate('builder');
                });
            });
            const createNew = document.getElementById('dashCreateNew');
            if (createNew) {
                createNew.addEventListener('click', () => router.navigate('builder'));
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 10. BUILDER – DATA & RENDER (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function populateFormFromData(data) {
            document.getElementById('f-name').value = data.name || '';
            document.getElementById('f-title').value = data.title || '';
            document.getElementById('f-location').value = data.location || '';
            document.getElementById('f-email').value = data.email || '';
            document.getElementById('f-phone').value = data.phone || '';
            document.getElementById('f-site').value = data.site || '';
            document.getElementById('f-summary').value = data.summary || '';
            document.getElementById('f-skills').value = data.skills || '';
            document.getElementById('f-languages').value = data.languages || '';
            cvData.experience = data.experience || [{ role: '', company: '', start: '', end: '', description: '' }];
            cvData.education = data.education || [{ degree: '', school: '', year: '' }];
            cvData.template = data.template || 'modern';
            document.querySelectorAll('.template-selector button').forEach(b => {
                b.classList.toggle('active', b.dataset.tpl === cvData.template);
            });
            const doc = document.getElementById('cvDoc');
            doc.className = 'cv-document ' + cvData.template;
        }

        function loadDemo() {
            const demo = {
                name: 'Aline Uwase',
                title: 'Senior Product Manager',
                location: 'Kigali, Rwanda',
                email: 'aline.uwase@email.com',
                phone: '+250 788 123 456',
                site: 'linkedin.com/in/alineuwase',
                summary: 'Product leader with 6+ years building fintech solutions across East Africa. Track record of launching products that reached 2M+ users and generated $12M ARR. Passionate about inclusive design and data-driven decision making.',
                skills: 'Product Strategy, Data Analysis, Stakeholder Management, Agile/Scrum, User Research, A/B Testing, SQL, Python',
                languages: 'English — Fluent, Kinyarwanda — Native, French — Conversational',
                experience: [
                    { role: 'Senior Product Manager', company: 'PayAfrica', start: '2022', end: 'Present',
                        description: 'Led cross-functional team of 12 to launch mobile payment platform. Increased user retention by 40% and reduced churn by 25% through data-driven feature prioritization.' },
                    { role: 'Product Manager', company: 'TechRwanda', start: '2019', end: '2022',
                        description: 'Owned roadmap for B2B SaaS platform. Grew revenue from $2M to $8M ARR in 18 months. Established product analytics framework adopted company-wide.' }
                ],
                education: [
                    { degree: 'MBA, Technology Management', school: 'Carnegie Mellon Africa', year: '2019' },
                    { degree: 'BSc Computer Science', school: 'University of Rwanda', year: '2016' }
                ],
                template: 'modern'
            };
            cvData = JSON.parse(JSON.stringify(demo));
            populateFormFromData(cvData);
            renderBuilder();
        }

        function renderBuilder() {
            renderExperience();
            renderEducation();
            updateCV();
        }

        // Experience & Education rendering (same as before, using event delegation)
        function renderExperience() {
            const container = document.getElementById('experience-list');
            container.innerHTML = cvData.experience.map((exp, i) => `
            <div class="repeater-item" data-idx="${i}">
              <button class="remove-btn exp-remove" data-idx="${i}">×</button>
              <div class="field-group"><label>Role</label><input class="exp-role" data-idx="${i}" value="${exp.role}" placeholder="Job title"></div>
              <div class="field-group"><label>Company</label><input class="exp-company" data-idx="${i}" value="${exp.company}" placeholder="Company"></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="field-group"><label>Start</label><input class="exp-start" data-idx="${i}" value="${exp.start}" placeholder="2022"></div>
                <div class="field-group"><label>End</label><input class="exp-end" data-idx="${i}" value="${exp.end}" placeholder="Present"></div>
              </div>
              <div class="field-group"><label>Description</label><textarea class="exp-desc" data-idx="${i}" placeholder="What changed because of your work?">${exp.description}</textarea></div>
            </div>
          `).join('');

            container.querySelectorAll('.exp-role, .exp-company, .exp-start, .exp-end, .exp-desc').forEach(el => {
                el.addEventListener('input', function() {
                    const idx = +this.dataset.idx;
                    const field = this.classList.contains('exp-role') ? 'role' :
                        this.classList.contains('exp-company') ? 'company' :
                        this.classList.contains('exp-start') ? 'start' :
                        this.classList.contains('exp-end') ? 'end' : 'description';
                    cvData.experience[idx][field] = this.value;
                    updateCV();
                    autoSaveCV();
                });
            });
            container.querySelectorAll('.exp-remove').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = +this.dataset.idx;
                    cvData.experience.splice(idx, 1);
                    renderExperience();
                    updateCV();
                    autoSaveCV();
                });
            });
        }

        function renderEducation() {
            const container = document.getElementById('education-list');
            container.innerHTML = cvData.education.map((edu, i) => `
            <div class="repeater-item" data-idx="${i}">
              <button class="remove-btn edu-remove" data-idx="${i}">×</button>
              <div class="field-group"><label>Degree</label><input class="edu-degree" data-idx="${i}" value="${edu.degree}" placeholder="Bachelor of..."></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="field-group"><label>School</label><input class="edu-school" data-idx="${i}" value="${edu.school}" placeholder="University"></div>
                <div class="field-group"><label>Year</label><input class="edu-year" data-idx="${i}" value="${edu.year}" placeholder="2024"></div>
              </div>
            </div>
          `).join('');

            container.querySelectorAll('.edu-degree, .edu-school, .edu-year').forEach(el => {
                el.addEventListener('input', function() {
                    const idx = +this.dataset.idx;
                    const field = this.classList.contains('edu-degree') ? 'degree' :
                        this.classList.contains('edu-school') ? 'school' : 'year';
                    cvData.education[idx][field] = this.value;
                    updateCV();
                    autoSaveCV();
                });
            });
            container.querySelectorAll('.edu-remove').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = +this.dataset.idx;
                    cvData.education.splice(idx, 1);
                    renderEducation();
                    updateCV();
                    autoSaveCV();
                });
            });
        }

        function addExperience() {
            cvData.experience.push({ role: '', company: '', start: '', end: '', description: '' });
            renderExperience();
            updateCV();
            autoSaveCV();
        }

        function addEducation() {
            cvData.education.push({ degree: '', school: '', year: '' });
            renderEducation();
            updateCV();
            autoSaveCV();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 11. CV PREVIEW UPDATE (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateCV() {
            cvData.name = document.getElementById('f-name').value;
            cvData.title = document.getElementById('f-title').value;
            cvData.location = document.getElementById('f-location').value;
            cvData.email = document.getElementById('f-email').value;
            cvData.phone = document.getElementById('f-phone').value;
            cvData.site = document.getElementById('f-site').value;
            cvData.summary = document.getElementById('f-summary').value;
            cvData.skills = document.getElementById('f-skills').value;
            cvData.languages = document.getElementById('f-languages').value;

            document.getElementById('p-name').textContent = cvData.name || 'YOUR NAME';
            document.getElementById('p-title').textContent = cvData.title || 'Professional Title';
            document.getElementById('p-contact').innerHTML = [cvData.email, cvData.phone, cvData.location, cvData.site]
                .filter(Boolean).join('<br>') || '';
            document.getElementById('p-summary').textContent = cvData.summary || '';
            document.getElementById('p-languages').textContent = cvData.languages || '';

            const skillsEl = document.getElementById('p-skills');
            if (cvData.skills) {
                skillsEl.innerHTML = cvData.skills.split(',').filter(s => s.trim()).map(s =>
                    `<span style="font-size:9px;border-radius:99px;background:#eaf2fa;padding:3px 8px;color:#3b5c82;">${s.trim()}</span>`
                ).join('');
            } else skillsEl.innerHTML = '';

            const expEl = document.getElementById('p-experience');
            expEl.innerHTML = cvData.experience.filter(e => e.role || e.company).map(e => `
            <div style="margin-bottom:13px;">
              <span style="float:right;font-size:9px;color:#63728b;">${e.start}${e.end?' — '+e.end:''}</span>
              <b style="font-size:11px;color:#19263c;display:block;">${e.role||'Role'}</b>
              <div style="font-size:9.5px;color:#6a7a91;">${e.company}</div>
              <div style="font-size:9.5px;line-height:1.45;color:#4e5b70;margin-top:3px;white-space:pre-line;">${e.description}</div>
            </div>
          `).join('');

            const eduEl = document.getElementById('p-education');
            eduEl.innerHTML = cvData.education.filter(e => e.degree || e.school).map(e => `
            <div style="margin-bottom:13px;">
              <span style="float:right;font-size:9px;color:#63728b;">${e.year}</span>
              <b style="font-size:11px;color:#19263c;display:block;">${e.degree||'Degree'}</b>
              <div style="font-size:9.5px;color:#6a7a91;">${e.school}</div>
            </div>
          `).join('');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 12. AUTO-SAVE (debounced)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function autoSaveCV() {
            if (!currentUser) return;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveCVToFirestore();
            }, 1500);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 13. TEMPLATE SELECTOR (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setTemplate(tpl) {
            cvData.template = tpl;
            document.querySelectorAll('.template-selector button').forEach(b => {
                b.classList.toggle('active', b.dataset.tpl === tpl);
            });
            const doc = document.getElementById('cvDoc');
            doc.className = 'cv-document ' + tpl;
            const nameColor = tpl === 'modern' ? '#123e72' : tpl === 'elegant' ? '#21424a' : '#151515';
            const titleColor = tpl === 'modern' ? '#4483b7' : tpl === 'elegant' ? '#4a7c72' : '#555';
            document.getElementById('p-name').style.color = nameColor;
            document.getElementById('p-title').style.color = titleColor;
            autoSaveCV();
        }

        document.querySelectorAll('.template-selector button').forEach(btn => {
            btn.addEventListener('click', function() {
                setTemplate(this.dataset.tpl);
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 14. AI ENGINE – CALL VERCELL BACKEND (SECURE)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // The API key is stored as a Vercel environment variable (DEEPSEEK_KEY)
        // and is never exposed to the frontend.
        async function callOpenAI(prompt, context = 'builder') {
            try {
                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'API error');
                }
                const data = await response.json();
                return data.reply || 'Sorry, I could not process that.';
            } catch (error) {
                console.error('AI error:', error);
                // Fallback to simulated response (so the app never breaks)
                return simulateAIResponse(prompt);
            }
        }

        // Fallback simulation (same as before)
        function simulateAIResponse(query) {
            const q = query.toLowerCase();
            if (q.includes('summary') || q.includes('profile')) {
                return "I've rewritten your summary to lead with impact: 'Product leader who scaled fintech platforms to 2M+ users across East Africa. Specialized in zero-to-one launches and cross-functional team leadership.' This opens with metrics and geography — exactly what hiring managers scan for.";
            }
            if (q.includes('bullet') || q.includes('stronger') || q.includes('experience')) {
                return "Transformed your experience bullets using the STAR method with metrics:\n\n• Led cross-functional team of 12 to launch mobile payment platform, increasing user retention by 40% and reducing churn by 25%\n\n• Grew B2B SaaS revenue from $2M to $8M ARR in 18 months by establishing data-driven product analytics framework\n\nEach bullet now shows: Action → Metric → Outcome.";
            }
            if (q.includes('metric')) {
                return "Added quantifiable impact to your experience:\n\n• 2M+ users reached\n• $12M ARR generated\n• 40% retention increase\n• 25% churn reduction\n• 12-person team led\n• $2M → $8M ARR growth\n\nMetrics validate competence. Hiring managers spend 6 seconds on first scan — numbers catch the eye.";
            }
            if (q.includes('ats') || q.includes('keyword')) {
                return "ATS Scan Results:\n\n✓ Product Strategy (3 mentions)\n✓ Data Analysis (2 mentions)\n⚠ Stakeholder Management — missing! Add to experience\n⚠ Agile/Scrum — only 1 mention, increase density\n✓ User Research (2 mentions)\n\nRecommendation: Add 'Stakeholder Management' to your skills and weave 'Agile' into one more bullet.";
            }
            if (q.includes('interview')) {
                return "Based on your CV, here are 3 questions you'll likely face:\n\n1. 'Tell me about launching a product from zero to one.' → Focus on user research, MVP definition, and go-to-market.\n\n2. 'How do you prioritize features with limited resources?' → Mention your data analytics framework and RICE scoring.\n\n3. 'Describe a time you failed and what you learned.' → Choose the churn reduction story — shows resilience.\n\nWould you like me to coach you through any of these answers?";
            }
            if (q.includes('job') || q.includes('match')) {
                return "Job Match Analysis:\n\nYour CV aligns at 78% with typical Senior PM roles.\n\nStrengths:\n• Metrics-driven bullets (top 10% of candidates)\n• Leadership experience (team of 12)\n• Fintech domain expertise\n\nGaps:\n• No mention of P&L ownership\n• Missing stakeholder management evidence\n• Could add technical depth (APIs, SQL specifics)\n\nShall I rewrite a section to close these gaps?";
            }
            return "I've analyzed your query through multiple reasoning layers. Your CV shows strong product leadership with measurable impact. To make it exceptional, consider adding more technical depth and stakeholder management evidence. Would you like me to suggest specific improvements for any section?";
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 15. BUILDER AI CHAT (uses the secure callOpenAI)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function sendBuilderChat() {
            const input = document.getElementById('builderChatInput');
            const msg = input.value.trim();
            if (!msg) return;
            addBuilderMessage(msg, 'user');
            input.value = '';
            document.getElementById('aiStatusText').textContent = 'Thinking...';
            showThinkingChain('builder');
            try {
                const reply = await callOpenAI(msg, 'builder');
                addBuilderMessage(reply, 'ai');
            } catch (e) {
                addBuilderMessage('Sorry, I encountered an error. Please try again.', 'ai');
            }
            document.getElementById('aiStatusText').textContent = 'Ready to help';
            hideThinkingChain('builder');
        }

        function showThinkingChain(context) {
            const container = document.getElementById(context === 'builder' ? 'thinkingChain' : 'reasoningPanel');
            if (!container) return;
            container.style.display = 'block';
            container.innerHTML = `
            <div class="step active">🧠 Analyzing your request...</div>
            <div class="step">🔍 Searching best practices...</div>
            <div class="step">⚡ Crafting personalized advice...</div>
          `;
        }

        function hideThinkingChain(context) {
            const container = document.getElementById(context === 'builder' ? 'thinkingChain' : 'reasoningPanel');
            if (container) container.style.display = 'none';
        }

        function addBuilderMessage(text, who) {
            const container = document.getElementById('builderChat');
            const div = document.createElement('div');
            div.className = 'msg-bubble ' + who;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('builderSendBtn').addEventListener('click', sendBuilderChat);
        document.getElementById('builderChatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendBuilderChat();
        });

        document.querySelectorAll('#builderSuggestions button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('builderChatInput').value = this.dataset.prompt;
                sendBuilderChat();
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 16. AI STUDIO (uses the same secure callOpenAI)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function sendStudioMessage() {
            const input = document.getElementById('studioInput');
            const msg = input.value.trim();
            if (!msg) return;
            addStudioMessage(msg, 'user');
            input.value = '';
            updateReasoningPanel('start');
            try {
                const reply = await callOpenAI(msg, 'studio');
                addStudioMessage(reply, 'ai');
                updateReasoningPanel('complete');
            } catch (e) {
                addStudioMessage('Sorry, I encountered an error. Please try again.', 'ai');
                updateReasoningPanel('complete');
            }
        }

        function addStudioMessage(text, who) {
            const container = document.getElementById('studioMessages');
            const block = document.createElement('div');
            block.className = 'message-block ' + who;
            block.innerHTML = `
            <div class="msg-header"><div class="avatar">${who==='ai'?'✦':'You'}</div><span>${who==='ai'?'iMENA AI':'You'}</span></div>
            <div class="msg-body">${text.replace(/\n/g,'<br>')}</div>
          `;
            container.appendChild(block);
            container.scrollTop = container.scrollHeight;
        }

        function clearStudioChat() {
            document.getElementById('studioMessages').innerHTML = `
            <div class="message-block ai">
              <div class="msg-header"><div class="avatar">✦</div><span>iMENA AI</span></div>
              <div class="msg-body">Welcome to AI Studio. I'm operating with deep reasoning enabled. What would you like to work on?</div>
            </div>
          `;
        }

        function updateReasoningPanel(state) {
            const panel = document.getElementById('reasoningPanel');
            if (state === 'start') {
                panel.innerHTML =
                    '<div class="reasoning-step active"><div class="step-title">🧠 Initializing deep reasoning...</div><div class="step-desc">Loading multi-step analysis pipeline.</div></div>';
            } else if (state === 'complete') {
                panel.innerHTML = `
              <div class="reasoning-step"><div class="step-title" style="color:var(--teal-300);">✅ Analysis complete</div><div class="step-desc">Response generated through chain-of-thought reasoning.</div></div>
              <div class="reasoning-step"><div class="step-title">📊 Confidence</div><div class="step-desc">High — based on 12,000+ CV patterns analyzed.</div></div>
            `;
            }
        }

        document.getElementById('studioSendBtn').addEventListener('click', sendStudioMessage);
        document.getElementById('studioInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                sendStudioMessage(); }
        });
        document.getElementById('studioClearBtn').addEventListener('click', clearStudioChat);

        // Studio thread switching
        document.querySelectorAll('.ai-thread').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('.ai-thread').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                if (this.dataset.tool) {
                    const tool = this.dataset.tool;
                    clearStudioChat();
                    const prompts = {
                        'job-match': 'Paste a job description below and I will analyze your CV fit, identify keyword gaps, and suggest tailored improvements.',
                        'interview': 'I will generate role-specific interview questions based on your CV and coach you through model answers. What role are you preparing for?',
                        'skills': 'I will analyze your skills against industry trends and identify high-value capabilities to add. Shall I begin?'
                    };
                    setTimeout(() => addStudioMessage(prompts[tool] || 'Tool activated.', 'ai'), 300);
                } else {
                    clearStudioChat();
                }
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 17. NAVIGATION EVENTS (unchanged)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.getElementById('navLogo').addEventListener('click', () => router.navigate('landing'));
        document.getElementById('navLanding').addEventListener('click', () => router.navigate('landing'));
        document.getElementById('navDashboard').addEventListener('click', () => router.navigate('dashboard'));
        document.getElementById('navBuilder').addEventListener('click', () => router.navigate('builder'));
        document.getElementById('navAIStudio').addEventListener('click', () => router.navigate('ai-studio'));
        document.getElementById('navLogin').addEventListener('click', signInWithGoogle);
        document.getElementById('navLogout').addEventListener('click', signOutUser);

        // Hero & CTA
        document.getElementById('heroStartBtn').addEventListener('click', () => {
            if (currentUser) router.navigate('builder');
            else signInWithGoogle();
        });
        document.getElementById('heroDemoBtn').addEventListener('click', () => router.navigate('builder'));
        document.getElementById('ctaStartBtn').addEventListener('click', () => {
            if (currentUser) router.navigate('builder');
            else signInWithGoogle();
        });

        document.getElementById('navTemplates').addEventListener('click', () => {
            document.getElementById('landing-templates').scrollIntoView({ behavior: 'smooth' });
        });

        // Footer
        document.getElementById('footerBuilder').addEventListener('click', () => router.navigate('builder'));
        document.getElementById('footerTemplates').addEventListener('click', () => {
            document.getElementById('landing-templates').scrollIntoView({ behavior: 'smooth' });
        });
        document.getElementById('footerAI').addEventListener('click', () => router.navigate('ai-studio'));
        document.getElementById('footerBack').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        // Dashboard events
        document.getElementById('dashNewCV').addEventListener('click', () => router.navigate('builder'));
        document.getElementById('dashViewAll').addEventListener('click', () => router.navigate('builder'));

        document.querySelectorAll('.template-item').forEach(el => {
            el.addEventListener('click', function() {
                const tpl = this.dataset.template;
                router.navigate('builder');
                setTimeout(() => {
                    setTemplate(tpl);
                }, 200);
            });
        });

        document.querySelectorAll('.faq-q').forEach(btn => {
            btn.addEventListener('click', function() {
                this.parentElement.classList.toggle('open');
            });
        });

        document.getElementById('exportPdfBtn').addEventListener('click', () => window.print());

        document.getElementById('addExpBtn').addEventListener('click', addExperience);
        document.getElementById('addEduBtn').addEventListener('click', addEducation);

        document.getElementById('manualSaveBtn').addEventListener('click', saveCVToFirestore);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 18. SCROLL EFFECT, 3D TILT, PARTICLES (same)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('scroll', () => {
            document.getElementById('topNav').classList.toggle('scrolled', window.scrollY > 50);
        });

        const cvCanvasEl = document.getElementById('cvCanvas');
        cvCanvasEl.addEventListener('mousemove', e => {
            if (window.innerWidth < 1024) return;
            const r = cvCanvasEl.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            document.getElementById('cvDoc').style.transform = `rotateY(${x*4}deg) rotateX(${y*-4}deg)`;
        });
        cvCanvasEl.addEventListener('mouseleave', () => {
            document.getElementById('cvDoc').style.transform = '';
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 19. INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        updateAuthUI();
        if (currentUser) loadCVsList();

        console.log('✅ iMENA CV Builder with Vercel + DeepSeek backend (secure).');
        console.log('🔐 Authentication: Google (Firebase)');
        console.log('💾 Storage: Firestore');
        console.log('🧠 AI: DeepSeek via Vercel serverless function');
    </script>
</body>
</html>
